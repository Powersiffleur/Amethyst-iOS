name: Build Amethyst iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Amethyst IPA
    runs-on: macos-latest

    steps:
      # -------------------------------------------------------
      # 1. Télécharger Amethyst + tous les submodules
      # -------------------------------------------------------
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------------------------------
      # 2. Installer Java 8
      # Amethyst demande un JDK 8 pour la compilation Java
      # -------------------------------------------------------
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # -------------------------------------------------------
      # 3. Installer les dépendances nécessaires
      # -------------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            make \
            cmake \
            wget \
            ldid

          echo "Homebrew prefix:"
          brew --prefix

          echo "GNU Make prefix:"
          brew --prefix make

          echo "gmake:"
          "$(brew --prefix make)/bin/gmake" --version

          echo "cmake:"
          cmake --version

          echo "ldid:"
          which ldid

          echo "wget:"
          wget --version | head -n 1

      # -------------------------------------------------------
      # 4. Corriger le chemin /usr/local/bin/gmake
      # Certains fichiers du projet cherchent exactement ici
      # -------------------------------------------------------
      - name: Fix gmake path
        shell: bash
        run: |
          set -euxo pipefail

          GMAKE="$(brew --prefix make)/bin/gmake"

          echo "gmake réel = $GMAKE"

          test -x "$GMAKE"

          sudo mkdir -p /usr/local/bin
          sudo rm -f /usr/local/bin/gmake
          sudo ln -s "$GMAKE" /usr/local/bin/gmake

          echo "Vérification:"
          ls -la /usr/local/bin/gmake
          /usr/local/bin/gmake --version

          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      # -------------------------------------------------------
      # 5. Vérifier Xcode
      # -------------------------------------------------------
      - name: Check Xcode
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version

      # -------------------------------------------------------
      # 6. Vérifier Java
      # -------------------------------------------------------
      - name: Check Java
        shell: bash
        run: |
          set -euxo pipefail

          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      # -------------------------------------------------------
      # 7. Vérifier que tous les submodules existent
      # -------------------------------------------------------
      - name: Check submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule status --recursive

      # -------------------------------------------------------
      # 8. Compiler Amethyst iOS
      #
      # PLATFORM=2 = iOS
      # SLIMMED=1 = crée aussi la version slimmed
      # -------------------------------------------------------
      - name: Build Amethyst iOS
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="/usr/local/bin:$(brew --prefix)/bin:$(brew --prefix make)/bin:$PATH"

          echo "PATH=$PATH"

          which gmake
          gmake --version

          export SLIMMED=1

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            dsym \
            package \
            PLATFORM=2 \
            SLIMMED=1 \
            BOOTJDK="$JAVA_HOME/bin"

      # -------------------------------------------------------
      # 9. Voir les fichiers créés
      # -------------------------------------------------------
      - name: Show build artifacts
        if: always()
        shell: bash
        run: |
          echo "=== ARTIFACTS ==="
          find artifacts -maxdepth 2 -type f -print 2>/dev/null || true

      # -------------------------------------------------------
      # 10. IPA complète pour SideStore
      # -------------------------------------------------------
      - name: Upload Amethyst IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Full
          path: |
            artifacts/org.angelauramc.amethyst-*-ios.ipa
          if-no-files-found: error

      # -------------------------------------------------------
      # 11. IPA slimmed
      # -------------------------------------------------------
      - name: Upload Amethyst Slimmed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Slimmed
          path: |
            artifacts/org.angelauramc.amethyst.slimmed-*-ios.ipa
          if-no-files-found: warn

      # -------------------------------------------------------
      # 12. Symboles de debug
      # -------------------------------------------------------
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
          if-no-files-found: warn
